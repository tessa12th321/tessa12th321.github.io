name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AAD294: ${{ secrets.AAD294 }}
          B9C783: ${{ secrets.B9C783 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('AAD294', '')
          meta_b = os.environ.get('B9C783', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 2721d9323b479a256b88e9fb59cb6fb0 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 9302767aa668c8674f69f0 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
